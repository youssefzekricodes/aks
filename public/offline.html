<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c1c1f" />
    <title>Hors connexion – Auto Kontor Sfax</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #1c1c1f;
        color: #f4f4f5;
        text-align: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      img {
        width: 160px;
        height: auto;
        margin-bottom: 28px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 auto 24px;
        max-width: 320px;
        color: #a1a1aa;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        font: inherit;
        font-weight: 600;
        background: oklch(0.55 0.215 27);
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/aks-logo.png" alt="Auto Kontor Sfax" />
      <h1>Vous êtes hors connexion</h1>
      <p>Vérifiez votre connexion Internet, puis réessayez pour voir nos véhicules.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>

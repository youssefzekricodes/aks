<!doctype html>
<html lang="fr" data-target="/?depuis=admin">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c1c1f" />
    <meta name="robots" content="noindex" />
    <title>Auto Kontor Sfax</title>
    <!--
      "Voir le site" from the admin opens this page in a new tab: a static file,
      kept by the service worker, so the splash shows at once instead of a white
      tab; it then opens the site, whose own splash looks exactly the same (the
      browser keeps this page on screen until the next one can be drawn).
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c1c1f;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: "Inter Variable", ui-sans-serif, system-ui, sans-serif;
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 0 2rem;
      }
      .logo {
        height: 3.5rem;
        width: auto;
        animation: in 0.5s ease-out both;
      }
      .label {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.25rem;
        letter-spacing: 0.025em;
        color: rgb(255 255 255 / 0.6);
      }
      .track {
        position: relative;
        height: 0.25rem;
        width: 7rem;
        overflow: hidden;
        border-radius: 9999px;
        background: rgb(255 255 255 / 0.1);
      }
      .bar {
        position: absolute;
        inset-block: 0;
        width: 33.333%;
        border-radius: 9999px;
        background: oklch(0.62 0.2 27);
        animation: sweep 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo,
        .bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" role="status" aria-live="polite">
      <div class="stack">
        <img
          class="logo"
          src="/images/aks-logo.png"
          alt="Auto Kontor Sfax"
          width="168"
          height="56"
        />
        <p class="label">Ouverture du site…</p>
        <span class="track" aria-hidden="true"><span class="bar"></span></span>
        <span class="sr-only">Chargement du site…</span>
      </div>
    </div>
    <script>
      // Draw this screen first (logo included, at most a short wait), then open
      // the admin: the browser keeps it visible until the admin can be drawn.
      (function () {
        var target = document.documentElement.dataset.target || "/admin";
        var done = false;
        function go() {
          if (done) return;
          done = true;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              location.replace(target);
            });
          });
        }
        var logo = document.querySelector(".logo");
        if (logo && logo.decode) logo.decode().then(go, go);
        else go();
        setTimeout(go, 300);
      })();
    </script>
  </body>
</html>
